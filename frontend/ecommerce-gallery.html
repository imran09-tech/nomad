<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Gallery Component</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --popup-bg: rgba(17, 24, 39, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Add some subtle radial gradient in background */
      background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent 40%);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      max-width: 1100px;
      width: 100%;
      padding: 40px;
    }

    /* CARD STYLES */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
      border: 1px solid var(--glass-border);
      aspect-ratio: 4 / 5;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      border-color: rgba(255, 255, 255, 0.2);
      z-index: 10;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-basic-info {
      padding: 24px;
      background: linear-gradient(to top, rgba(17,24,39,1) 0%, rgba(17,24,39,0.8) 50%, transparent 100%);
      position: absolute;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
      pointer-events: none; /* Let the card handle hover events */
    }

    .card-basic-info h3 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card-basic-info p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
    }

    /* POPUP MODAL STYLES */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 720px;
      height: 420px;
      background: var(--popup-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      
      /* Animation Initial States */
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      visibility: hidden;
      transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                  visibility 0.4s;
      z-index: 1000;
      pointer-events: none;
    }

    .popup.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      visibility: visible;
      pointer-events: auto;
    }

    .popup-left {
      flex: 0 0 45%;
      overflow: hidden;
      position: relative;
    }

    .popup-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Trigger slow zoom when popup opens */
    .popup.active .popup-left img {
      transform: scale(1.15);
    }

    .popup-right {
      flex: 0 0 55%;
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
    }

    .popup-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .popup-title {
      margin: 0 0 16px 0;
      font-size: 1.85rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .popup-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin: 0 0 28px 0;
      flex-grow: 1;
    }

    .popup-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .popup-price {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .popup-stock {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-radius: 99px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popup-stock.low-stock {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .popup-stock.out-stock {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .popup-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .popup-btn::after {
      content: '→';
      transition: transform 0.25s ease;
    }

    .popup-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.5);
    }

    .popup-btn:hover::after {
      transform: translateX(4px);
    }

    /* Staggered load animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>
<body>

  <div class="gallery-container">
    <!-- Card 1 -->
    <div class="card" 
         data-title="Aura Smartwatch"
         data-category="Wearables"
         data-desc="Next-generation smartwatch featuring advanced health tracking, a vibrant OLED display, and a sleek aerospace-grade aluminum body. Stay connected effortlessly."
         data-price="$299.00"
         data-stock="In Stock"
         data-image="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500">
       <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Aura Smartwatch" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'">
       <div class="card-basic-info">
         <h3>Aura Smartwatch</h3>
         <p>$299.00</p>
       </div>
    </div>

    <!-- Card 2 -->
    <div class="card" 
         data-title="Echo Noise-Canceling"
         data-category="Audio"
         data-desc="Immerse yourself in pure sound. These premium over-ear headphones deliver industry-leading noise cancellation and cinematic audio quality for audiophiles."
         data-price="$349.00"
         data-stock="Low Stock"
         data-image="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">
       <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Echo Headphones" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500'">
       <div class="card-basic-info">
         <h3>Echo Noise-Canceling</h3>
         <p>$349.00</p>
       </div>
    </div>

    <!-- Card 3 -->
    <div class="card" 
         data-title="Nova Mechanical"
         data-category="Accessories"
         data-desc="Elevate your typing experience. Features customizable per-key RGB lighting, tactile mechanical switches, and a minimalist, heavy-duty aerospace frame."
         data-price="$179.00"
         data-stock="Out of Stock"
         data-image="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500">
       <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" alt="Nova Keyboard" onerror="this.src='https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500'">
       <div class="card-basic-info">
         <h3>Nova Mechanical</h3>
         <p>$179.00</p>
       </div>
    </div>
  </div>

  <!-- The Shared Popup Modal -->
  <div id="product-popup" class="popup">
    <div class="popup-left">
      <img id="popup-image" src="" alt="Product Details" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'">
    </div>
    <div class="popup-right">
      <div class="popup-category" id="popup-category">Category</div>
      <h2 class="popup-title" id="popup-title">Product Title</h2>
      <p class="popup-desc" id="popup-desc">Product description...</p>
      
      <div class="popup-meta">
        <span class="popup-price" id="popup-price">$0.00</span>
        <span class="popup-stock" id="popup-stock">In Stock</span>
      </div>
      
      <button class="popup-btn" id="popup-btn">Add to Cart</button>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');
    const popup = document.getElementById('product-popup');
    
    // Popup DOM Elements
    const pImg = document.getElementById('popup-image');
    const pCat = document.getElementById('popup-category');
    const pTitle = document.getElementById('popup-title');
    const pDesc = document.getElementById('popup-desc');
    const pPrice = document.getElementById('popup-price');
    const pStock = document.getElementById('popup-stock');
    const pBtn = document.getElementById('popup-btn');

    let hoverTimer;
    let hideTimer;

    cards.forEach(card => {
      card.addEventListener('mouseenter', () => {
        clearTimeout(hideTimer);
        
        // 150ms delay prevents accidental popups when quickly moving mouse over grid
        hoverTimer = setTimeout(() => {
          // 1. Update Content
          pImg.src = card.dataset.image;
          pCat.textContent = card.dataset.category;
          pTitle.textContent = card.dataset.title;
          pDesc.textContent = card.dataset.desc;
          pPrice.textContent = card.dataset.price;
          
          const stock = card.dataset.stock;
          pStock.textContent = stock;
          pStock.className = 'popup-stock'; // Reset classes
          pBtn.textContent = 'Add to Cart';
          
          if(stock.toLowerCase().includes('low')) {
            pStock.classList.add('low-stock');
          } else if(stock.toLowerCase().includes('out')) {
            pStock.classList.add('out-stock');
            pBtn.textContent = 'View Details'; // Update CTA if out of stock
          }

          // 2. Smart Positioning Algorithm
          const rect = card.getBoundingClientRect();
          const popupWidth = 720;
          const popupHeight = 420;
          
          // Default: try to perfectly center the popup over the card
          let top = rect.top + (rect.height / 2) - (popupHeight / 2);
          let left = rect.left + (rect.width / 2) - (popupWidth / 2);
          
          // Collision detection against viewport boundaries (with 24px padding)
          const padding = 24;
          const windowWidth = window.innerWidth;
          const windowHeight = window.innerHeight;

          if (left < padding) left = padding;
          if (top < padding) top = padding;
          
          if (left + popupWidth > windowWidth - padding) {
            left = windowWidth - popupWidth - padding;
          }
          if (top + popupHeight > windowHeight - padding) {
            top = windowHeight - popupHeight - padding;
          }
          
          popup.style.top = `${top}px`;
          popup.style.left = `${left}px`;
          
          // 3. Trigger Animations
          popup.classList.add('active');
        }, 150);
      });

      card.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
        // Allow a 200ms grace period to move mouse from card to the newly opened popup
        hideTimer = setTimeout(() => {
          popup.classList.remove('active');
        }, 200);
      });
    });

    // Keep popup open when hovering over the popup itself
    popup.addEventListener('mouseenter', () => {
      clearTimeout(hideTimer);
    });

    popup.addEventListener('mouseleave', () => {
      hideTimer = setTimeout(() => {
        popup.classList.remove('active');
      }, 200);
    });
  </script>
</body>
</html>
